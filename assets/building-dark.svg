<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="100%" role="img" aria-label="Now building: grounded financial QA. Question, retrieve, draft, verify, answer, with a retry loop when verification fails.">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.flow{stroke-dasharray:6 6;animation:flow 0.9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.A{opacity:0;animation-duration:10s;animation-iteration-count:infinite}
.n1{animation-name:n1}@keyframes n1{0%,1%{opacity:0}2%,10%{opacity:1}12%,100%{opacity:0}}
.n2{animation-name:n2}@keyframes n2{0%,11%{opacity:0}12%,22%{opacity:1}24%,100%{opacity:0}}
.n3{animation-name:n3}@keyframes n3{0%,23%{opacity:0}24%,34%{opacity:1}36%,53%{opacity:0}54%,64%{opacity:1}66%,100%{opacity:0}}
.n4w{animation-name:n4w}@keyframes n4w{0%,35%{opacity:0}36%,46%{opacity:1}48%,100%{opacity:0}}
.arc{animation-name:arc}@keyframes arc{0%,46%{opacity:0}47%,54%{opacity:1}56%,100%{opacity:0}}
.n4o{animation-name:n4o}@keyframes n4o{0%,65%{opacity:0}66%,78%{opacity:1}80%,100%{opacity:0}}
.n5{animation-name:n5}@keyframes n5{0%,77%{opacity:0}78%,94%{opacity:1}97%,100%{opacity:0}}
</style>
<rect x="0.5" y="0.5" width="1279" height="249" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="60" y="56" class="mono" font-size="15" fill="#79c0ff">// now building</text>
<text x="1220" y="56" class="mono" font-size="14" fill="#7d8590" text-anchor="end">status: in progress</text>
<text x="60" y="94" font-size="30" font-weight="700" fill="#e6edf3">grounded-financial-qa</text>
<text x="60" y="124" font-size="17" fill="#7d8590">Questions over public annual reports. Every figure and quote is checked against its source before you see it.</text>
<path d="M865 176 C865 150 625 150 625 176" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path class="A arc" d="M865 176 C865 150 625 150 625 176" fill="none" stroke="#d29922" stroke-width="2.5"/>
<path class="A arc" d="M619 166 L625 177 L632 167" fill="none" stroke="#d29922" stroke-width="2.5" stroke-linejoin="round"/>
<text x="745" y="144" class="mono" font-size="12" fill="#7d8590" text-anchor="middle">retry on mismatch</text>
<line class="flow" x1="230" y1="198" x2="300" y2="198" stroke="#7d8590" stroke-width="1.5"/>
<line class="flow" x1="470" y1="198" x2="540" y2="198" stroke="#7d8590" stroke-width="1.5"/>
<line class="flow" x1="710" y1="198" x2="780" y2="198" stroke="#7d8590" stroke-width="1.5"/>
<line class="flow" x1="950" y1="198" x2="1020" y2="198" stroke="#7d8590" stroke-width="1.5"/>
<rect x="60" y="176" width="170" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
<rect class="A n1" x="60" y="176" width="170" height="44" rx="10" fill="#0c2d6b" stroke="#79c0ff" stroke-width="1.5"/>
<text x="78" y="203" class="mono" font-size="12" fill="#7d8590">01</text>
<text x="157" y="204" class="mono" font-size="16" fill="#e6edf3" text-anchor="middle">question</text>
<rect x="300" y="176" width="170" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
<rect class="A n2" x="300" y="176" width="170" height="44" rx="10" fill="#0c2d6b" stroke="#79c0ff" stroke-width="1.5"/>
<text x="318" y="203" class="mono" font-size="12" fill="#7d8590">02</text>
<text x="397" y="204" class="mono" font-size="16" fill="#e6edf3" text-anchor="middle">retrieve</text>
<rect x="540" y="176" width="170" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
<rect class="A n3" x="540" y="176" width="170" height="44" rx="10" fill="#0c2d6b" stroke="#79c0ff" stroke-width="1.5"/>
<text x="558" y="203" class="mono" font-size="12" fill="#7d8590">03</text>
<text x="637" y="204" class="mono" font-size="16" fill="#e6edf3" text-anchor="middle">draft</text>
<rect x="780" y="176" width="170" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
<rect class="A n4w" x="780" y="176" width="170" height="44" rx="10" fill="#2b2111" stroke="#d29922" stroke-width="1.5"/>
<rect class="A n4o" x="780" y="176" width="170" height="44" rx="10" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="798" y="203" class="mono" font-size="12" fill="#7d8590">04</text>
<text x="877" y="204" class="mono" font-size="16" fill="#e6edf3" text-anchor="middle">verify</text>
<rect x="1020" y="176" width="170" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
<rect class="A n5" x="1020" y="176" width="170" height="44" rx="10" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="1038" y="203" class="mono" font-size="12" fill="#7d8590">05</text>
<text x="1117" y="204" class="mono" font-size="16" fill="#e6edf3" text-anchor="middle">answer</text>
</svg>
