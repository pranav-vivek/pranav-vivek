<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="100%" role="img" aria-label="Pranav Vivek, applied AI engineer. Automating the boring parts with agents and LLMs.">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7ee787"/><stop offset="1" stop-color="#79c0ff"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#161c24" stroke-width="1"/></pattern>
<radialGradient id="fade" cx="0.75" cy="0.45" r="0.75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="m"><rect width="1280" height="340" fill="url(#fade)"/></mask>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="frame"><rect width="1280" height="340" rx="16"/></clipPath>
<clipPath id="typeclip"><rect class="typer" x="56" y="196" width="608" height="36"/></clipPath>
</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.typer{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:type 3s steps(50) .5s forwards}
@keyframes type{to{transform:scaleX(1)}}
.cursor{animation:move 3s steps(50) .5s forwards,blink 1.05s step-end infinite}
@keyframes move{to{transform:translateX(600px)}}
@keyframes blink{50%{opacity:0}}
.glow{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
.L{animation-duration:9s;animation-iteration-count:infinite}
.scan1{opacity:0;animation-name:scan1}
@keyframes scan1{0%,9%{opacity:0;transform:translateX(0)}10%{opacity:1;transform:translateX(0)}19%{opacity:1;transform:translateX(44px)}20%,100%{opacity:0;transform:translateX(44px)}}
.ok1{opacity:0;animation-name:ok1}
@keyframes ok1{0%,20%{opacity:0}22%,94%{opacity:1}97%,100%{opacity:0}}
.scan2{opacity:0;animation-name:scan2}
@keyframes scan2{0%,34%{opacity:0;transform:translateX(0)}35%{opacity:1;transform:translateX(0)}44%{opacity:1;transform:translateX(66px)}45%,100%{opacity:0;transform:translateX(66px)}}
.warn{opacity:0;animation-name:warn}
@keyframes warn{0%,45%{opacity:0}47%,58%{opacity:1}61%,100%{opacity:0}}
.oldv{animation-name:oldv}
@keyframes oldv{0%,58%{opacity:1}61%,95%{opacity:0}98%,100%{opacity:1}}
.newv{opacity:0;animation-name:newv}
@keyframes newv{0%,59%{opacity:0}62%,94%{opacity:1}97%,100%{opacity:0}}
.done{opacity:0;animation-name:done}
@keyframes done{0%,66%{opacity:0}70%,94%{opacity:1}97%,100%{opacity:0}}
</style>
<g clip-path="url(#frame)">
<rect width="1280" height="340" fill="#0d1117"/>
<rect width="1280" height="340" fill="url(#grid)" mask="url(#m)"/>
<g opacity="0.45"><circle class="glow" cx="1000" cy="170" r="210" fill="#1f6feb" filter="url(#blur)"/></g>
</g>
<rect x="0.5" y="0.5" width="1279" height="339" rx="16" fill="none" stroke="#30363d"/>
<text x="60" y="98" class="mono" font-size="16" fill="#79c0ff">// applied AI engineer · dubai</text>
<text x="56" y="172" font-size="72" font-weight="700" letter-spacing="-1.5" fill="url(#g)">Pranav Vivek</text>
<g clip-path="url(#typeclip)">
<text x="60" y="222" class="mono" font-size="20" fill="#e6edf3" textLength="600" lengthAdjust="spacingAndGlyphs">&gt; automating the boring parts with agents and LLMs</text>
</g>
<rect class="cursor" x="62" y="204" width="11" height="23" fill="#7ee787"/>
<rect x="740" y="46" width="500" height="248" rx="12" fill="#161b22" stroke="#30363d"/>
<circle cx="764" cy="70" r="5" fill="#30363d"/><circle cx="782" cy="70" r="5" fill="#30363d"/><circle cx="800" cy="70" r="5" fill="#30363d"/>
<text x="1216" y="75" class="mono" font-size="13" fill="#7d8590" text-anchor="end">verify · answer check</text>
<line x1="740" y1="90" x2="1240" y2="90" stroke="#30363d"/>
<text x="768" y="126" class="mono" font-size="16" fill="#7d8590" textLength="268" lengthAdjust="spacingAndGlyphs">Q  What was FY2025 net profit?</text>
<text x="768" y="168" class="mono" font-size="18" fill="#e6edf3" textLength="194" lengthAdjust="spacingAndGlyphs">A  Net profit rose</text>
<rect x="978" y="148" width="52" height="28" rx="6" fill="#21262d"/>
<rect class="L ok1" x="978" y="148" width="52" height="28" rx="6" fill="#12261e" stroke="#3fb950"/>
<text x="986" y="168" class="mono" font-size="18" fill="#e6edf3" textLength="36" lengthAdjust="spacingAndGlyphs">18%</text>
<rect class="L scan1" x="980" y="146" width="4" height="32" rx="2" fill="#79c0ff"/>
<text x="1040" y="168" class="mono" font-size="18" fill="#e6edf3" textLength="22" lengthAdjust="spacingAndGlyphs">to</text>
<rect x="1070" y="148" width="74" height="28" rx="6" fill="#21262d"/>
<rect class="L warn" x="1070" y="148" width="74" height="28" rx="6" fill="#2b2111" stroke="#d29922"/>
<rect class="L newv" x="1070" y="148" width="74" height="28" rx="6" fill="#12261e" stroke="#3fb950"/>
<text class="L oldv" x="1078" y="168" font-size="18" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" textLength="58" lengthAdjust="spacingAndGlyphs">4.2bn</text>
<text class="L newv" x="1078" y="168" font-size="18" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" textLength="58" lengthAdjust="spacingAndGlyphs">3.9bn</text>
<rect class="L scan2" x="1072" y="146" width="4" height="32" rx="2" fill="#79c0ff"/>
<text x="1154" y="168" class="mono" font-size="18" fill="#7d8590" textLength="64" lengthAdjust="spacingAndGlyphs">[p.41]</text>
<g class="L ok1">
<rect x="768" y="196" width="204" height="30" rx="15" fill="#12261e" stroke="#3fb950"/>
<text x="784" y="216" class="mono" font-size="14" fill="#3fb950">✓ 18% · found on p.41</text>
</g>
<g class="L warn">
<rect x="984" y="196" width="232" height="30" rx="15" fill="#2b2111" stroke="#d29922"/>
<text x="1000" y="216" class="mono" font-size="14" fill="#d29922">✗ 4.2bn · not in source</text>
</g>
<g class="L newv">
<rect x="984" y="196" width="232" height="30" rx="15" fill="#12261e" stroke="#3fb950"/>
<text x="1000" y="216" class="mono" font-size="14" fill="#3fb950">✓ 3.9bn · fixed on retry</text>
</g>
<line x1="768" y1="248" x2="1216" y2="248" stroke="#30363d" stroke-dasharray="3 5"/>
<text x="768" y="276" class="mono" font-size="14" fill="#7d8590">every claim checked against source</text>
<text class="L done" x="1216" y="276" font-size="14" fill="#3fb950" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">2/2 grounded ✓</text>
</svg>
