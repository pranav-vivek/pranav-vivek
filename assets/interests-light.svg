<g class="in" style="animation-delay:0.36s"><rect x="590.5" y="98" width="213" height="52" rx="26" fill="#f6f8fa" stroke="#d0d7de"/><rect class="hl" style="animation-delay:3.0s" x="590.5" y="98" width="213" height="52" rx="26" fill="none" stroke="#bc4c00" stroke-width="2"/><circle cx="618.5" cy="124" r="6" fill="#bc4c00"/><circle class="ping" style="animation-delay:3.0s;transform-origin:618.5px 124px" cx="618.5" cy="124" r="6" fill="none" stroke="#bc4c00" stroke-width="2"/><text x="634.5" y="131" font-size="20" font-weight="600" fill="#1f2328">Data Analysis</text></g>
