<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="100%" role="img" aria-label="Interested in: Agentic AI, LLMs, RAG, Data Analysis, Automation, Evals.">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.flow{stroke-dasharray:6 6;animation:flow 0.9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.in{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hl{opacity:0;animation:hl 6s ease-in-out infinite}
@keyframes hl{0%,100%{opacity:0}6%,14%{opacity:1}22%{opacity:0}}
.ping{opacity:0;animation:ping 6s ease-out infinite}
@keyframes ping{0%{opacity:0;transform:scale(1)}4%{opacity:.9;transform:scale(1)}16%{opacity:0;transform:scale(2.6)}100%{opacity:0}}
</style>
<rect x="0.5" y="0.5" width="1279" height="189" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="60" y="56" class="mono" font-size="15" fill="#0969da">// interested in</text>
<line class="flow" x1="147.5" y1="124" x2="1132.5" y2="124" stroke="#d0d7de" stroke-width="1.5"/>
<g class="in" style="animation-delay:0.00s"><rect x="127.5" y="98" width="180" height="52" rx="26" fill="#f6f8fa" stroke="#d0d7de"/><rect class="hl" style="animation-delay:0.0s" x="127.5" y="98" width="180" height="52" rx="26" fill="none" stroke="#0969da" stroke-width="2"/><circle cx="155.5" cy="124" r="6" fill="#0969da"/><circle class="ping" style="animation-delay:0.0s;transform-origin:155.5px 124px" cx="155.5" cy="124" r="6" fill="none" stroke="#0969da" stroke-width="2"/><text x="171.5" y="131" font-size="20" font-weight="600" fill="#1f2328">Agentic AI</text></g>
